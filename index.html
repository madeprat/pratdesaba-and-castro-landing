<!DOCTYPE html>
<html lang="es" data-palette="tinta">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pratdesaba &amp; Castro</title>
  <meta name="description" content="Pratdesaba & Castro. Estrategia, procesos e ingeniería para organizaciones que no admiten improvisación.">
  <meta property="og:title" content="Pratdesaba &amp; Castro">
  <meta property="og:description" content="Estrategia, procesos e ingeniería para organizaciones que no admiten improvisación.">
  <meta property="og:url" content="https://prat-cas.com/">
  <meta property="og:type" content="website">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' fill='%230F1726'/%3E%3Ctext x='32' y='48' text-anchor='middle' font-family='Georgia,serif' font-style='italic' font-size='48' fill='%23C9A86A'%3E%26%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    :root,
    [data-palette="tinta"] {
      --bg: #0F1726;
      --light: rgba(201, 168, 106, 0.07);
      --text: #ECE8DF;
      --muted: #8F99AA;
      --accent: #C9A86A;
    }
    [data-palette="piedra"] {
      --bg: #13201C;
      --light: rgba(194, 160, 96, 0.07);
      --text: #E8E3D6;
      --muted: #94A199;
      --accent: #C2A060;
    }
    [data-palette="travertino"] {
      --bg: #E4E1DA;
      --light: rgba(255, 255, 255, 0.55);
      --text: #1D232B;
      --muted: #5E646B;
      --accent: #8A6A3A;
    }

    * { box-sizing: border-box; }

    html, body { height: 100%; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      grid-template-rows: 1fr auto;
      background:
        radial-gradient(ellipse 70% 55% at 50% 0%, var(--light), transparent 70%),
        var(--bg);
      color: var(--text);
      font-family: "Instrument Sans", "Helvetica Neue", Arial, sans-serif;
      font-size: 1rem;
      line-height: 1.55;
      -webkit-font-smoothing: antialiased;
      transition: background-color .4s ease, color .4s ease;
    }

    .serif {
      font-family: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
      font-optical-sizing: auto;
    }

    main {
      display: grid;
      place-items: center;
      padding: 64px 24px 40px;
    }

    .hall {
      width: min(100%, 1120px);
      text-align: center;
    }

    h1 {
      margin: 0;
      font-weight: 400;
      font-size: inherit;
    }

    .names {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      column-gap: clamp(16px, 3vw, 40px);
    }

    .amp {
      display: block;
      font-style: italic;
      font-size: clamp(9rem, 22vw, 19rem);
      line-height: 0.8;
      color: var(--accent);
      user-select: none;
      animation: appear 1.8s ease-out both;
    }

    .door {
      display: block;
      padding: 18px 8px;
      color: inherit;
      text-decoration: none;
      outline: none;
    }
    .door-left { text-align: right; }
    .door-right { text-align: left; }

    .first {
      display: block;
      margin-bottom: 4px;
      font-size: 0.95rem;
      color: var(--muted);
      letter-spacing: 0.02em;
    }

    .surname {
      display: inline-block;
      position: relative;
      font-size: clamp(2.4rem, 5.2vw, 4.6rem);
      line-height: 1.05;
      letter-spacing: -0.01em;
    }
    .surname::after {
      content: "";
      position: absolute;
      left: 0;
      right: 0;
      bottom: -6px;
      height: 1px;
      background: var(--accent);
      transform: scaleX(0);
      transform-origin: center;
      transition: transform .5s ease;
    }
    .door:hover .surname::after,
    .door:focus-visible .surname::after { transform: scaleX(1); }

    .door:focus-visible .surname {
      outline: 1px solid var(--accent);
      outline-offset: 10px;
    }

    .field {
      display: block;
      margin-top: 18px;
      font-size: 0.95rem;
      color: var(--muted);
    }

    .enter {
      display: inline-block;
      margin-top: 10px;
      font-size: 0.9rem;
      color: var(--accent);
    }

    .rule {
      width: min(240px, 50%);
      height: 1px;
      margin: clamp(40px, 7vh, 72px) auto clamp(28px, 4vh, 40px);
      background: var(--accent);
      opacity: 0.6;
      transform-origin: center;
      animation: draw 1.4s .5s ease-out both;
    }

    .statement {
      max-width: 44ch;
      margin: 0 auto;
      font-size: clamp(1.25rem, 2.2vw, 1.6rem);
      line-height: 1.4;
      font-style: italic;
    }

    footer {
      display: flex;
      justify-content: center;
      gap: 28px;
      padding: 20px clamp(16px, 4vw, 40px) 24px;
      font-size: 0.82rem;
      color: var(--muted);
    }
    footer a {
      color: inherit;
      text-decoration: none;
      transition: color .2s ease;
    }
    footer a:hover,
    footer a:focus-visible { color: var(--text); }
    footer a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }

    @keyframes appear {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes draw {
      from { transform: scaleX(0); }
      to { transform: scaleX(1); }
    }

    @media (max-width: 760px) {
      main { padding: 48px 16px 32px; }
      .names {
        grid-template-columns: 1fr;
        row-gap: 0;
      }
      .door-left, .door-right { text-align: center; }
      .door { padding: 10px 0; }
      .amp {
        font-size: clamp(6rem, 34vw, 9rem);
        line-height: 0.9;
        order: 0;
      }
      .field { margin-top: 10px; }
      .rule { margin: 36px auto 24px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .amp, .rule { animation: none; }
      .surname::after { transition: none; }
      body { transition: none; }
    }

  </style>
</head>
<body>

  <main>
    <div class="hall">
      <h1 class="names">
        <a class="door door-left" href="https://jcpratdesaba.prat-cas.com/">
          <span class="first">Juan Carlos</span>
          <span class="surname serif">Pratdesaba</span>
          <span class="field">Ingeniería y dirección de proyectos</span>
          <span class="enter">Conocer a Juan Carlos</span>
        </a>
        <span class="amp serif" aria-label="y">&amp;</span>
        <a class="door door-right" href="madecastro.html">
          <span class="first">Madelaine</span>
          <span class="surname serif">Castro</span>
          <span class="field">Procesos, calidad y gobierno</span>
          <span class="enter">Conocer a Made</span>
        </a>
      </h1>

      <div class="rule" aria-hidden="true"></div>

      <p class="statement serif">Estrategia, procesos e ingeniería para organizaciones que no admiten improvisación.</p>
    </div>
  </main>

  <footer>
    <span>&copy; 2026 Pratdesaba &amp; Castro</span>
    <a href="proyectos.html">Proyectos</a>
  </footer>

</body>
</html>
